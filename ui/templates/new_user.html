<!DOCTYPE html>
<html>
<head>
    <title>Nutrition Pro – New User</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        .upload-box{

            border:2px dashed #94a3b8;

            border-radius:12px;

            padding:20px;

            margin-top:10px;

            background:#f8fafc;
        }

        .upload-info{

            font-size:14px;

            color:#475569;

            margin-top:10px;

            line-height:1.6;
        }

        .section-title{

            margin-top:25px;
        }

    </style>

</head>

<body>

<div class="container card">

    <h2>New User Registration</h2>

    <form method="POST"
          action="/save-user"
          enctype="multipart/form-data"
          onsubmit="return validateForm()">

        <!-- BASIC INFO -->

        <label>Name</label>

        <input type="text"
               name="name"
               required>

        <label>Age</label>

        <input type="number"
               name="age"
               required
               min="1">

        <label>Gender</label>

        <select name="gender">

            <option value="female">
                Female
            </option>

            <option value="male">
                Male
            </option>

        </select>

        <label>Height (cm)</label>

        <input type="number"
               name="height"
               required
               min="80">

        <label>Weight (kg)</label>

        <input type="number"
               name="weight"
               required
               min="10">

        <label>Activity Level</label>

        <select name="activity_level" required>

            <option value="sedentary">
                Sedentary
            </option>

            <option value="light">
                Lightly Active
            </option>

            <option value="moderate">
                Moderately Active
            </option>

            <option value="active">
                Highly Active
            </option>

        </select>

        <label>Diet Preference</label>

        <select name="diet">

            <option value="vegan">
                Vegan
            </option>

            <option value="vegetarian">
                Vegetarian
            </option>

            <option value="non-vegetarian">
                Non-Vegetarian
            </option>

        </select>

        <!-- PDF REPORT -->

        <h3 class="section-title">
            Upload Your Latest Blood Test / Biomarker Report(Optional)
        </h3>

        <div class="upload-box">

            <input type="file"
                   name="report_pdf"
                   accept=".pdf">

            <div class="upload-info">

                Upload blood test / biomarker report PDF.<br>

            </div>

        </div>

        <hr>

        <!-- BIOMARKER SUGGESTIONS -->

        <datalist id="biomarkerList">

            {% for bm in biomarkers %}

            <option value="{{ bm }}"></option>

            {% endfor %}

        </datalist>

        <script>

            const biomarkerUnits = JSON.parse(
                '{{ biomarker_units | tojson | safe }}'
            );

        </script>

        <!-- BLOOD MARKERS -->

        <h3 class="section-title">
            Blood Marker Report Value Manual Input (Optional)
        </h3>

        <div id="biomarkers"></div>

        <button type="button"
                onclick="addBiomarker()">

            + Add New Blood Marker

        </button>
        <hr>
           <!-- GENOME FILE -->

        <h3 class="section-title">
            Upload Genomic Raw test report file
        </h3>

        <div class="upload-box">

            <input type="file"
                   name="genome_file"
                   accept=".txt,.csv">

            <div class="upload-info">

                Upload your genomic raw data file.<br><br>

            </div>

        </div>

        <hr>

        <!-- NAV -->

        <div class="nav">

            <button type="submit">

                Go to account creation page

            </button>

            <a href="/">

                <button type="button"
                        class="back-btn">

                    Back to Home

                </button>

            </a>

        </div>

    </form>

</div>

<script>

function addBiomarker() {

    const container = document.getElementById(
        "biomarkers"
    );

    const div = document.createElement("div");

    div.className = "row";

    div.innerHTML = `

        <input list="biomarkerList"
               name="biomarker_name[]"
               placeholder="Biomarker"
               oninput="autoUnit(this)">

        <input type="number"
               step="0.01"
               name="biomarker_value[]"
               placeholder="Value">

        <input type="text"
               name="biomarker_unit[]"
               placeholder="Unit">

    `;

    container.appendChild(div);
}

function autoUnit(input) {

    const row = input.closest(".row");

    const unitInput = row.querySelector(

        "input[name='biomarker_unit[]']"

    );

    const key = input.value.toLowerCase();

    if (biomarkerUnits[key]) {

        unitInput.value = biomarkerUnits[key];
    }
}

function validateForm() {

    let valid = true;

    document.querySelectorAll("input").forEach(el => {

        el.style.borderColor = "#ccc";
    });

    document.querySelectorAll(

        "input[name='biomarker_name[]']"

    ).forEach((el, i) => {

        const val = document.querySelectorAll(

            "input[name='biomarker_value[]']"

        )[i];

        if (el.value && !val.value) {

            el.style.borderColor = "red";

            val.style.borderColor = "red";

            valid = false;
        }

    });

    if (!valid) {

        alert(

            "Please fill all biomarker values correctly."

        );
    }

    return valid;
}

</script>

</body>
</html>
