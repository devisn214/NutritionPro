<!DOCTYPE html>
<html>
<head>
    <title>Update Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container card">
    <h2>Update Profile</h2>

    <form method="POST" action="/save-updated-profile/{{ user.user_id }}" onsubmit="return validateForm()">

        <label>Height (cm)</label>
        <input type="number" name="height" value="{{ user.height_cm }}" required>

        <label>Weight (kg)</label>
        <input type="number" name="weight" value="{{ user.weight_kg }}" required>

        <hr>

        <datalist id="biomarkerList">
            {% for bm in biomarkers %}
                <option value="{{ bm }}"></option>
            {% endfor %}
        </datalist>

        <datalist id="geneList">
            {% for gene in genes %}
                <option value="{{ gene }}"></option>
            {% endfor %}
        </datalist>

        <h3>Blood Markers</h3>
        <div id="biomarkers">
            {% for b in user.biomarkers %}
            <div class="row">
                <input list="biomarkerList" name="biomarker_name[]" value="{{ b.name }}" oninput="autoUnit(this)">
                <input type="number" step="0.01" name="biomarker_value[]" value="{{ b.value }}">
                <input type="text" name="biomarker_unit[]" value="{{ b.unit }}">
            </div>
            {% endfor %}
        </div>

        <button type="button" onclick="addBiomarker()">+ Add Blood Marker</button>

        <hr>

        <h3>Genes</h3>
        <div id="genes">
            {% for g in user.genes %}
            <div class="row">
                <input list="geneList" name="gene_name[]" value="{{ g.name }}">

                <select name="gene_status[]" onchange="toggleVariant(this)">
                    <option value="normal" {% if g.variant == "Normal" %}selected{% endif %}>Normal</option>
                    <option value="variant" {% if g.variant != "Normal" %}selected{% endif %}>Variant</option>
                </select>

                <input type="text" name="gene_variant[]" 
                       value="{{ g.variant if g.variant != 'Normal' else '' }}" 
                       class="variant-input {% if g.variant == 'Normal' %}hidden{% endif %}"
                       placeholder="Variant (e.g. C282Y)">
            </div>
            {% endfor %}
        </div>

        <button type="button" onclick="addGene()">+ Add Gene</button>

        <div class="nav">
            <button type="submit">Save Updates</button>
            <a href="/"><button type="button" class="back-btn">Back to Home</button></a>
        </div>
    </form>
</div>

<script>
const biomarkerUnits = JSON.parse('{{ biomarker_units | tojson | safe }}');

function addBiomarker() {
    const container = document.getElementById("biomarkers");
    container.insertAdjacentHTML("beforeend",
        `<div class="row">
            <input list="biomarkerList" name="biomarker_name[]" oninput="autoUnit(this)">
            <input type="number" step="0.01" name="biomarker_value[]">
            <input type="text" name="biomarker_unit[]">
        </div>`
    );
}

function addGene() {
    const container = document.getElementById("genes");
    container.insertAdjacentHTML("beforeend",
        `<div class="row">
            <input list="geneList" name="gene_name[]" placeholder="Gene">

            <select name="gene_status[]" onchange="toggleVariant(this)">
                <option value="normal">Normal</option>
                <option value="variant">Variant</option>
            </select>

            <input type="text" name="gene_variant[]" class="variant-input hidden" placeholder="Variant (e.g. C282Y)">
        </div>`
    );
}

function toggleVariant(select) {
    const row = select.closest(".row");
    const variantInput = row.querySelector(".variant-input");

    if (select.value === "variant") {
        variantInput.classList.remove("hidden");
    } else {
        variantInput.classList.add("hidden");
        variantInput.value = "";
    }
}

function autoUnit(input) {
    const row = input.closest(".row");
    const unitInput = row.querySelector("input[name='biomarker_unit[]']");
    const key = input.value.toLowerCase();
    if (biomarkerUnits[key]) unitInput.value = biomarkerUnits[key];
}

function validateForm() {
    let valid = true;
    document.querySelectorAll("input").forEach(el => el.style.borderColor = "#ccc");

    document.querySelectorAll("input[name='biomarker_name[]']").forEach((el, i) => {
        const val = document.querySelectorAll("input[name='biomarker_value[]']")[i];
        if (el.value && !val.value) {
            el.style.borderColor = "red";
            val.style.borderColor = "red";
            valid = false;
        }
    });

    if (!valid) alert("Invalid biomarker values.");
    return valid;
}
</script>

</body>
</html>
