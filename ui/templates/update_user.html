<!DOCTYPE html>
<html>
<head>
    <title>Update Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container card">
    <h2>Update Profile</h2>

    <form method="POST" action="/save-updated-profile/{{ user.user_id }}" enctype="multipart/form-data" onsubmit="return validateForm()">

        <label>Height (cm)</label>
        <input type="number" name="height" value="{{ user.height_cm }}" required>

        <label>Weight (kg)</label>
        <input type="number" name="weight" value="{{ user.weight_kg }}" required>

        <hr>

        <label>Upload Blood Report (PDF)</label>
        <input type="file" name="report_pdf" accept=".pdf">

        <datalist id="biomarkerList">
            {% for bm in biomarkers %}
                <option value="{{ bm }}"></option>
            {% endfor %}
        </datalist>

        <datalist id="geneList">
            {% for gene in genes %}
                <option value="{{ gene }}"></option>
            {% endfor %}
        </datalist>

        <script>
            const biomarkerUnits = JSON.parse('{{ biomarker_units | tojson | safe }}');
            const geneVariants = JSON.parse('{{ gene_variants | tojson | safe }}');
        </script>

        <h3>Blood Markers</h3>

        <div id="biomarkers">

            {% for b in user.biomarkers %}
            <div class="row">
                <input list="biomarkerList"
                       name="biomarker_name[]"
                       value="{{ b.name }}"
                       oninput="autoUnit(this)">

                <input type="number"
                       step="0.01"
                       name="biomarker_value[]"
                       value="{{ b.value }}">

                <input type="text"
                       name="biomarker_unit[]"
                       value="{{ b.unit }}">
            </div>
            {% endfor %}

        </div>

        <button type="button" onclick="addBiomarker()">+ Add Blood Marker</button>

        <hr>

        <h3>Genes</h3>

        <div id="genes">

            {% for g in user.genes %}
            <div class="row">

                <input list="geneList"
                       name="gene_name[]"
                       value="{{ g.name }}"
                       oninput="loadVariants(this)">

                <input type="text"
                       name="gene_variant[]"
                       value="{{ g.variant }}"
                       class="variant-input"
                       placeholder="rsID Variant">

            </div>
            {% endfor %}

        </div>

        <button type="button" onclick="addGene()">+ Add Gene</button>

        <div class="nav">
            <button type="submit">Save Updates</button>
            <a href="/"><button type="button" class="back-btn">Back to Home</button></a>
        </div>

    </form>
</div>

<script>

function addBiomarker() {

    const container = document.getElementById("biomarkers");

    container.insertAdjacentHTML("beforeend",
        `<div class="row">
            <input list="biomarkerList"
                   name="biomarker_name[]"
                   oninput="autoUnit(this)">

            <input type="number"
                   step="0.01"
                   name="biomarker_value[]">

            <input type="text"
                   name="biomarker_unit[]">
        </div>`
    );
}

function addGene() {

    const container = document.getElementById("genes");

    const uniqueId = "variantList_" + Date.now();

    container.insertAdjacentHTML("beforeend",
        `<div class="row">

            <input list="geneList"
                   name="gene_name[]"
                   placeholder="Gene Symbol"
                   oninput="loadVariants(this)">

            <input type="text"
                   list="${uniqueId}"
                   name="gene_variant[]"
                   class="variant-input"
                   placeholder="rsID Variant">

            <datalist id="${uniqueId}"></datalist>

        </div>`
    );
}

function loadVariants(inputBox) {

    const gene = inputBox.value.trim().toUpperCase();
    const row = inputBox.closest(".row");

    const variantInput = row.querySelector("input[name='gene_variant[]']");
    const listId = variantInput.getAttribute("list");

    if (!listId) return;

    const datalist = document.getElementById(listId);

    if (!datalist) return;

    datalist.innerHTML = "";

    if (geneVariants[gene]) {

        geneVariants[gene].forEach(v => {
            datalist.innerHTML += `<option value="${v}"></option>`;
        });

    }
}

function autoUnit(input) {

    const row = input.closest(".row");

    const unitInput = row.querySelector("input[name='biomarker_unit[]']");

    const key = input.value.toLowerCase();

    if (biomarkerUnits[key]) {
        unitInput.value = biomarkerUnits[key];
    }
}

function validateForm() {

    let valid = true;

    document.querySelectorAll("input").forEach(el => {
        el.style.borderColor = "#ccc";
    });

    document.querySelectorAll("input[name='biomarker_name[]']").forEach((el, i) => {

        const val = document.querySelectorAll("input[name='biomarker_value[]']")[i];

        if (el.value && !val.value) {

            el.style.borderColor = "red";
            val.style.borderColor = "red";

            valid = false;
        }

    });

    if (!valid) {
        alert("Invalid biomarker values.");
    }

    return valid;
}

</script>

</body>
</html>
