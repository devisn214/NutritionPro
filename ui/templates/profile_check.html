<!DOCTYPE html>
<html>
<head>
    <title>Profile Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container card">
    <h2>Profile Review</h2>

    <div class="info-box">
        {{ message | safe }}
    </div>

    <div class="decision-box">
        <p>Would you like to update your details?</p>

        <a href="/update-profile/{{ user_id }}">
            <button class="primary-btn">Update Profile</button>
        </a>

        <a href="/dashboard/{{ user_id }}">
            <button class="secondary-btn">Continue Without Updating</button>
        </a>
    </div>

    <a href="/dashboard/{{ user_id }}" class="back-link">← Back to Dashboard</a>
</div>

</body>
</html>
