<!DOCTYPE html>
<html>
<head>
    <title>Next Step</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>

        html, body{
            margin:0;
            padding:0;
            width:100%;
            height:100%;
            background:linear-gradient(135deg, #0f4c75, #1eb2a6);
        }

        .hidden{
            display:none;
        }

        #loaderScreen{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:linear-gradient(135deg, #0f4c75, #1eb2a6);
            padding:20px;
            z-index:9999;
        }

        #loaderScreen.show{
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .loading-box{
            text-align:center;
            max-width:500px;
            width:100%;
        }

        .spinner{
            width:75px;
            height:75px;
            margin:25px auto;
            border:6px solid #dbeafe;
            border-top:6px solid #2563ef;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            from{transform:rotate(0deg);}
            to{transform:rotate(360deg);}
        }

        .loading-text{
            font-size:22px;
            font-weight:700;
            color:#111827;
            margin-top:15px;
        }

        .subtext{
            margin-top:10px;
            color:#111827;
            font-size:16px;
            line-height:1.6;
        }

        .dot::after{
            content:"";
            animation:dots 1.5s steps(4,end) infinite;
        }

        @keyframes dots{
            0%{content:"";}
            25%{content:".";}
            50%{content:"..";}
            75%{content:"...";}
            100%{content:"";}
        }

    </style>
</head>

<body>

<!-- NORMAL PAGE -->
<div class="container" id="mainCard">

    <h2>Profile Updated Successfully</h2>
    <p>What would you like to do next?</p>

    <div class="nav">

        <form id="mealForm" action="/generate-meal/{{ user_id }}" method="get">
            <button type="submit" id="mealBtn">
                Generate 3 Meals for Today
            </button>
        </form>

        <a href="/">
            <button type="button" class="back-btn">
                Return to Home
            </button>
        </a>

    </div>

</div>

<!-- LOADER PAGE -->
<div id="loaderScreen" class="hidden">

    <div class="loading-box">

        <div class="spinner"></div>

        <div class="loading-text">
            AI generating meal plan<span class="dot"></span>
        </div>

        <div class="subtext">
            Analyzing your profile, genes, biomarkers and calories
        </div>

    </div>

</div>

<script>

document.getElementById("mealForm").addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("mainCard").style.display = "none";

    const loader = document.getElementById("loaderScreen");
    loader.classList.remove("hidden");
    loader.classList.add("show");

    window.location.href = this.action;

});

</script>

</body>
</html>
