<!DOCTYPE html>
<html>
<head>
    <title>Next Step</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- NORMAL PAGE -->
<div class="container" id="mainCard">

    <h2>Profile Updated Successfully</h2>
    <p>What would you like to do next?</p>

    <div class="nav">

        <form id="mealForm" action="/generate-meal/{{ user_id }}" method="get">
            <button type="submit" id="mealBtn">
                Generate 3 Meals for Today
            </button>
        </form>

        <a href="/">
            <button class="back-btn">Return to Home</button>
        </a>

    </div>

</div>


<!-- LOADER SCREEN -->
<div id="loaderScreen" class="hidden">

    <div class="container loading-screen">

        <h2>Generating Your Personalized Plan...</h2>

        <p class="loading-sub">
            Analyzing biomarkers, genes, calories & meal suitability
        </p>

        <div class="progress-ring-wrap">
            <div class="progress-ring">
                <span id="progressNum">0%</span>
            </div>
        </div>

        <div class="progress-bar-wrap">
            <div id="progressBar" class="progress-bar-fill"></div>
        </div>

        <div id="progressText" class="loading-step">
            Initializing...
        </div>

    </div>

</div>


<script>

const form = document.getElementById("mealForm");

form.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("mainCard").style.display = "none";
    document.getElementById("loaderScreen").classList.remove("hidden");

    const steps = [
        "Reading profile...",
        "Analyzing biomarkers...",
        "Checking gene variants...",
        "Matching food database...",
        "Calculating calories...",
        "Generating AI meal plan...",
        "Finalizing report..."
    ];

    let progress = 0;
    let step = 0;

    const num = document.getElementById("progressNum");
    const bar = document.getElementById("progressBar");
    const text = document.getElementById("progressText");

    const interval = setInterval(() => {

        progress++;

        num.innerText = progress + "%";
        bar.style.width = progress + "%";

        if(progress % 15 === 0 && step < steps.length-1){
            step++;
            text.innerText = steps[step];
        }

        if(progress >= 100){
            clearInterval(interval);
            form.submit();
        }

    }, 25);

});

</script>

</body>
</html>
