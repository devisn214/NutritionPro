<!DOCTYPE html>
<html>
<head>
    <title>Create Account</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container card">

    <h2>Create Account</h2>

    <form method="POST" action="/create-account/{{ user_id }}">

        <label>Username</label>

        <input type="text"
               name="username"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               required>

        <label>Confirm Password</label>

        <input type="password"
               name="confirm_password"
               required>

        <button type="submit">
            Create Account
        </button>

    </form>

</div>

</body>
</html>
